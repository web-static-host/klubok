<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/klubok/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/klubok/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/klubok/logo.svg" />
    <link rel="apple-touch-icon" href="/klubok/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070D12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Клубок — идеи, которые можно повторить: рецепты, лайфхаки, дом и рукоделие." />
    <title>Клубок</title>
    <script>
      // тема до первой отрисовки, чтобы не было вспышки
      try {
        var t = localStorage.getItem('klubok.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <script>
      // Первая порция ленты «Для вас» и категории — запрашиваем сразу, пока грузится код сайта. Сайт возьмёт уже начатые запросы
      // (адреса должны совпадать с feedQuery и TOPICS_QUERY в src/supabase.ts, порядок — как feedSeed в src/store.tsx).
      // Вошедшему — с его пропуском (лента по интересам). Соединение с сервером открываем заранее.
      try {
        var api = '%VITE_API_URL%';
        if (!api || api.charAt(0) === '%') api = '%VITE_SUPABASE_URL%';
        api = api.replace(/\/+$/, '');
        var key = '%VITE_SUPABASE_PUBLISHABLE_KEY%';
        [false, true].forEach(function (cors) {
          var l = document.createElement('link');
          l.rel = 'preconnect';
          l.href = new URL(api).origin;
          if (cors) l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        });
        var seed = new Date().toISOString().slice(0, 10);
        try {
          var c = JSON.parse(localStorage.getItem('klubok.data.v2'));
          if (c && typeof c.seed === 'string' && Date.now() - c.at < 6 * 3600000) seed = c.seed;
        } catch (e) {}
        var token = null;
        try {
          var ref = new URL('%VITE_SUPABASE_URL%').hostname.split('.')[0];
          var ses = JSON.parse(localStorage.getItem('sb-' + ref + '-auth-token'));
          if (ses && ses.access_token && ses.expires_at * 1000 > Date.now() + 30000) token = ses.access_token;
        } catch (e) {}
        window.__klubokPre = {};
        [
          ['rpc/feed?p_seed=' + encodeURIComponent(seed) + '&p_offset=0&p_limit=30', true],
          ['rpc/used_topics', false],
        ].forEach(function (x) {
          var auth = x[1] && token;
          var p = fetch(api + '/rest/v1/' + x[0] + (x[0].indexOf('?') < 0 ? '?' : '&') + 'apikey=' + key, auth ? { headers: { Authorization: 'Bearer ' + token } } : undefined).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          });
          p.catch(function () {});
          window.__klubokPre[x[0] + (auth ? '#auth' : '')] = p;
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
