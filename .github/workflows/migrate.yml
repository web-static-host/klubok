# Обновления базы Supabase: новые файлы supabase/migrations/*.sql запускаются сами после попадания в main.
# Нужен секрет SUPABASE_ACCESS_TOKEN (с правом на SQL). Нет секрета — шаг пропускается.
name: Обновление базы Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
      - name: Запустить новые обновления
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node .github/scripts/migrate.mjs
      - name: Нет ключа
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "Секрет SUPABASE_ACCESS_TOKEN не задан — обновления базы нужно запускать вручную"
