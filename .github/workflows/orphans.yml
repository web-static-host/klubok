# Раз в сутки удаляет ничейные картинки: загрузили в форму, но не опубликовали (старше двух суток), или аккаунта уже нет.
name: Уборка картинок

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  orphans:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/orphans.mjs
