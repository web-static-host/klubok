<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Эталонные экраны дизайн-системы</title>
<!--
  Эталонные экраны «Списки.Заметки» для DESIGN_SYSTEM.md — живой интерфейс, 390×868.
  Открывать через dev-сервер: http://localhost:5173/design-system/ref.html?screen=lists&theme=light
  Съёмка: powershell -File store-screens\capture.ps1 -Page "design-system/ref.html" -Query "screen=lists&theme=light"
          -Width 390 -Height 868 -Scale 2 -OutFile design-system\screens\lists-light.png
  ВНИМАНИЕ: очищает списки приложения в этом браузере и заполняет демо-данными.
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { width: 390px; height: 868px; overflow: hidden; }
  iframe { border: 0; width: 390px; height: 868px; display: block; }
</style>
</head>
<body>
<iframe id="app" title="Списки.Заметки"></iframe>
<script type="module">
  import { resetApp, makeList, openApp, openList, sleep } from '../store-screens/lib.js';

  const q = new URLSearchParams(location.search);
  const screen = q.get('screen') || 'lists';
  const theme = q.get('theme') === 'dark' ? 'dark' : 'light';

  const m = await resetApp({ theme, catalogViewMode: 'list', favoritesViewMode: 'tiles' });

  await makeList(m, {
    name: 'Продукты', preset: 'quick', icon: 'ShoppingCart', favorite: true,
    items: [['Молоко', { quantity: '2 л' }], ['Хлеб бородинский'], ['Яблоки', { quantity: '1 кг' }], ['Кофе в зёрнах'],
      ['Яйца', { quantity: '10 шт' }], ['Сыр', { isBought: true }], ['Бананы', { quantity: '1 кг', isBought: true }]],
  });
  await makeList(m, {
    name: 'Хочу купить', preset: 'planned', icon: 'Gift', favorite: true,
    items: [['Наушники', { price: 12990 }], ['Кофемашина', { price: 24500 }], ['Кроссовки', { price: 8700 }], ['Рюкзак', { price: 4300 }]],
  });
  await makeList(m, {
    name: 'Отпуск в Сочи', preset: 'travel', icon: 'Umbrella', favorite: true,
    items: [['Паспорт', { isBought: true }], ['Купальник'], ['Солнцезащитный крем'], ['Очки'], ['Аптечка']],
  });
  await makeList(m, {
    name: 'Идеи', preset: 'note', icon: 'Bookmark', noteFormat: 'chat',
    items: [['Книги на осень: «Дюна», «Три товарища»'], ['Подарок маме на ДР — посмотреть наушники'], ['Записаться на плавание в субботу']],
  });
  await makeList(m, {
    name: 'Дела по дому', preset: 'custom', icon: 'Home', customColor: ['#6ee7b7', '#059669'],
    items: [['Оплатить интернет', { isBought: true }], ['Разобрать шкаф'], ['Позвонить сантехнику']],
  });

  const frame = document.getElementById('app');
  const click = (doc, text) => {
    const el = [...doc.querySelectorAll('span,div,button')].find((e) => e.childElementCount === 0 && e.textContent.trim() === text);
    el?.click();
    return !!el;
  };

  let doc;
  switch (screen) {
    case 'favorites': doc = await openApp(frame); break;
    case 'lists': doc = await openApp(frame, { tab: 'Все списки' }); break;
    case 'settings': doc = await openApp(frame, { tab: 'Настройки' }); break;
    case 'list': doc = await openApp(frame, { tab: 'Все списки' }); await openList(doc, 'Продукты'); break;
    case 'wishlist': doc = await openApp(frame, { tab: 'Все списки' }); await openList(doc, 'Хочу купить'); break;
    case 'chat': doc = await openApp(frame, { tab: 'Все списки' }); await openList(doc, 'Идеи'); break;
    case 'sheet-create':
      doc = await openApp(frame, { tab: 'Все списки' });
      doc.querySelector('button[aria-label="Создать"]')?.click();
      break;
    case 'sheet-list-settings':
      doc = await openApp(frame, { tab: 'Все списки' });
      await openList(doc, 'Продукты');
      doc.querySelector('button[aria-label="Меню"]')?.click();
      await sleep(500);
      click(doc, 'Настройки списка');
      break;
    case 'sheet-confirm':
      doc = await openApp(frame, { tab: 'Настройки' });
      click(doc, 'Восстановить из файла');
      break;
  }
  await sleep(1200);
  document.body.dataset.ready = '1';
</script>
</body>
</html>
