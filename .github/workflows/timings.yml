# Замеры проверки картинок (только по запуску вручную): сколько занимает каждый шаг проверки ИИ.
name: Замеры проверки картинок

on:
  workflow_dispatch:

jobs:
  timings:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/timings.mjs
