<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/klubok/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/klubok/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/klubok/logo.svg" />
    <link rel="apple-touch-icon" href="/klubok/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070D12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Клубок — идеи, которые можно повторить: рецепты, лайфхаки, дом и рукоделие." />
    <title>Клубок</title>
    <script>
      // тема до первой отрисовки, чтобы не было вспышки
      try {
        var t = localStorage.getItem('klubok.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <script>
      // Лента, авторы и отзывы — запрашиваем сразу, пока грузится код сайта. Сайт возьмёт уже начатые запросы
      // (список должен совпадать с PUBLIC_QUERIES в src/supabase.ts). Соединение с сервером открываем заранее.
      try {
        var api = '%VITE_API_URL%';
        if (!api || api.charAt(0) === '%') api = '%VITE_SUPABASE_URL%';
        api = api.replace(/\/+$/, '');
        var key = '%VITE_SUPABASE_PUBLISHABLE_KEY%';
        [false, true].forEach(function (cors) {
          var l = document.createElement('link');
          l.rel = 'preconnect';
          l.href = new URL(api).origin;
          if (cors) l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        });
        window.__klubokPre = {};
        [
          'profiles?select=*',
          'posts?select=*&order=created_at.desc&limit=1000',
          'tries?select=*&order=created_at.desc&limit=5000',
          'try_replies?select=*&order=created_at.asc&limit=10000',
        ].forEach(function (q) {
          var p = fetch(api + '/rest/v1/' + q + '&apikey=' + key).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          });
          p.catch(function () {});
          window.__klubokPre[q] = p;
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
